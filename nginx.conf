server {
    listen 80;
    server_name localhost;

    # 1. Internal Docker DNS
    resolver 127.0.0.11 valid=30s;

    # Relative Location headers on redirects: keep the client's host and port
    absolute_redirect off;

    # ---------------------------------------------------------
    # THE CENTRAL HUB
    # ---------------------------------------------------------
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # ---------------------------------------------------------
    # PROYECTO: INVENTARIO IT
    # ---------------------------------------------------------
    # Without the trailing slash, the app's relative links (index.html, api/v1/...) would resolve against "/".
    location = /inventario {
        return 301 /inventario/;
    }

    # Frontend + API: the inventory frontend container proxies /api/ to its own backend,
    # so the whole app (pages, API, Swagger) lives under /inventario/.
    location /inventario/ {
        set $upstream_inventario http://inventario-frontend:80;

        # When using variables, Nginx does not trim the URL automatically.
        # This line removes "/inventario" before passing it to your web app.
        rewrite ^/inventario/(.*) /$1 break;

        proxy_pass $upstream_inventario;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Let Spring Boot (Swagger, redirects) build public URLs: scheme, host:port and the /inventario prefix.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix /inventario;

        # Excel uploads (default is 1 MB)
        client_max_body_size 10m;
    }
}
